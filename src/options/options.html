<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapScribe Options</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="options">
      <header class="header">
        <span class="brand-mark" aria-hidden="true">
          <svg
            class="ic"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="1.5" y="3.75" width="13" height="9.75" rx="2.25" />
            <path d="M5.15 3.75 5.95 2.25h4.1l.8 1.5" />
            <circle cx="8" cy="8.55" r="2.55" />
          </svg>
        </span>
        <div>
          <h1>SnapScribe</h1>
          <p class="tagline">On-device capture. Nothing leaves your browser.</p>
        </div>
      </header>

      <form id="options-form" class="form">
        <section class="field">
          <h2>Default export format</h2>
          <div class="format-selector" role="group" aria-label="Default export format">
            <button id="format-png" class="format-option" type="button" aria-pressed="true">
              PNG
            </button>
            <button id="format-jpeg" class="format-option" type="button" aria-pressed="false">
              JPEG
            </button>
            <button id="format-pdf" class="format-option" type="button" aria-pressed="false">
              PDF
            </button>
          </div>
        </section>

        <section class="field">
          <h2>JPEG / PDF quality</h2>
          <div class="quality">
            <input id="quality" type="range" min="1" max="100" value="90" />
            <output id="quality-value" for="quality">90</output>
          </div>
        </section>

        <section class="field">
          <label for="filename-pattern">Filename pattern</label>
          <input id="filename-pattern" class="text-input" type="text" spellcheck="false" />
          <p class="hint">
            Available tokens: <code>{site}</code> <code>{date}</code> <code>{time}</code>
          </p>
        </section>

        <section class="field">
          <h2>Theme</h2>
          <div class="theme-options" role="radiogroup" aria-label="Theme">
            <label class="theme-option">
              <input type="radio" name="theme" value="dark" checked />
              <svg
                class="ic"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12.9 9.85A5 5 0 0 1 6.15 3.1a5.25 5.25 0 1 0 6.75 6.75z" />
              </svg>
              <span>Dark</span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme" value="light" />
              <svg
                class="ic"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="8" cy="8" r="3.1" />
                <path d="M8 1.9v1.5M8 12.6v1.5M1.9 8h1.5M12.6 8h1.5" />
                <path d="m3.7 3.7 1.05 1.05M11.25 11.25l1.05 1.05" />
                <path d="m12.3 3.7-1.05 1.05M4.75 11.25l-1.05 1.05" />
              </svg>
              <span>Light</span>
            </label>
          </div>
        </section>

        <section class="field">
          <h2>Capture history</h2>
          <button id="clear-history" class="danger-button" type="button">
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2.9 4.25h10.2" />
              <path d="M6.05 4.25V3.05a.95.95 0 0 1 .95-.95h2a.95.95 0 0 1 .95.95v1.2" />
              <path
                d="M4.3 4.25l.55 8.35a1.1 1.1 0 0 0 1.1 1.05h4.1a1.1 1.1 0 0 0 1.1-1.05l.55-8.35"
              />
            </svg>
            <span>Clear all capture history</span>
          </button>
        </section>

        <div class="actions">
          <p id="status" class="status" role="status"></p>
          <button id="save" class="save-button" type="submit">Save</button>
        </div>
      </form>
    </main>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
