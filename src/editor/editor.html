<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapScribe Editor</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-row">
        <div class="tool-group" role="group" aria-label="Tools">
          <button
            id="tool-select"
            class="tool"
            type="button"
            aria-pressed="true"
            title="Select / move (V)"
            aria-label="Select / move (V)"
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m3.6 2.6 10.2 5.8-4.5 1.1-1.1 4.5z" />
            </svg>
          </button>
          <button
            id="tool-crop"
            class="tool"
            type="button"
            aria-pressed="false"
            title="Crop (C)"
            aria-label="Crop (C)"
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2.5 6.25V4.5A2 2 0 0 1 4.5 2.5h1.75" />
              <path d="M13.5 9.75V11.5a2 2 0 0 1-2 2H9.75" />
            </svg>
          </button>
          <button
            id="tool-rect"
            class="tool"
            type="button"
            aria-pressed="false"
            title="Rectangle (R)"
            aria-label="Rectangle (R)"
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="2.5" y="3.75" width="11" height="8.5" rx="1.75" />
            </svg>
          </button>
          <button
            id="tool-arrow"
            class="tool"
            type="button"
            aria-pressed="false"
            title="Arrow (A)"
            aria-label="Arrow (A)"
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3.25 12.75 10.9 5.1" />
              <path d="M6.6 5.1h4.3v4.3" />
            </svg>
          </button>
          <button
            id="tool-pen"
            class="tool"
            type="button"
            aria-pressed="false"
            title="Freehand pen (P)"
            aria-label="Freehand pen (P)"
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4.05 11.95 11.8 4.2a1.35 1.35 0 0 1 1.9 1.9L5.95 13.85z" />
              <path d="m11.2 3.6 1.2 1.2" />
              <path d="M4.05 11.95 2.6 13.4" />
            </svg>
          </button>
          <button
            id="tool-text"
            class="tool"
            type="button"
            aria-pressed="false"
            title="Text label (T)"
            aria-label="Text label (T)"
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4.25 3.5h7.5" />
              <path d="M8 3.5v9" />
            </svg>
          </button>
          <button
            id="tool-highlight"
            class="tool"
            type="button"
            aria-pressed="false"
            title="Highlighter (H)"
            aria-label="Highlighter (H)"
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m3 11.9 6.9-6.9 2.75 2.75-6.9 6.9z" />
            </svg>
          </button>
          <button
            id="tool-blur"
            class="tool"
            type="button"
            aria-pressed="false"
            title="Blur / redact (B)"
            aria-label="Blur / redact (B)"
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M8 2.25c1 1.1 3.95 4.45 3.95 7.3a3.95 3.95 0 1 1-7.9 0C4.05 6.7 7 3.35 8 2.25z"
              />
            </svg>
          </button>
        </div>
        <span class="tool-divider" aria-hidden="true"></span>
        <div class="tool-group" role="group" aria-label="History">
          <button
            id="undo"
            class="tool"
            type="button"
            title="Undo (Ctrl+Z)"
            aria-label="Undo (Ctrl+Z)"
            disabled
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4.1 10.1a4.9 4.9 0 1 0 3.5-6" />
              <path d="M4.1 3.4v3.4h3.4" />
            </svg>
          </button>
          <button
            id="redo"
            class="tool"
            type="button"
            title="Redo (Ctrl+Shift+Z)"
            aria-label="Redo (Ctrl+Shift+Z)"
            disabled
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M11.9 10.1a4.9 4.9 0 1 1-3.5-6" />
              <path d="M11.9 3.4v3.4H8.5" />
            </svg>
          </button>
          <button
            id="clear"
            class="tool"
            type="button"
            title="Clear all annotations"
            aria-label="Clear all annotations"
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2.9 4.25h10.2" />
              <path d="M6.05 4.25V3.05a.95.95 0 0 1 .95-.95h2a.95.95 0 0 1 .95.95v1.2" />
              <path
                d="M4.3 4.25l.55 8.35a1.1 1.1 0 0 0 1.1 1.05h4.1a1.1 1.1 0 0 0 1.1-1.05l.55-8.35"
              />
            </svg>
          </button>
        </div>
        <div class="tool-group grow"></div>
        <div class="tool-group" role="group" aria-label="Page">
          <button
            id="close"
            class="tool"
            type="button"
            title="Close editor"
            aria-label="Close editor"
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m4 4 8 8M12 4l-8 8" />
            </svg>
          </button>
        </div>
      </div>

      <div class="toolbar-row options-row">
        <div id="color-group" class="option-group" role="group" aria-label="Color">
          <span class="option-label">Color</span>
          <div id="swatches" class="swatches"></div>
        </div>
        <div id="stroke-group" class="option-group hidden" role="group" aria-label="Stroke width">
          <label class="option-label" for="stroke-width">Width</label>
          <select id="stroke-width">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="4" selected>4</option>
            <option value="8">8</option>
          </select>
        </div>
        <div id="font-group" class="option-group hidden" role="group" aria-label="Font size">
          <label class="option-label" for="font-size">Font</label>
          <select id="font-size">
            <option value="14">14</option>
            <option value="18">18</option>
            <option value="24" selected>24</option>
            <option value="32">32</option>
            <option value="48">48</option>
          </select>
        </div>
        <div id="blur-group" class="option-group hidden" role="group" aria-label="Blur radius">
          <label class="option-label" for="blur-radius">Radius</label>
          <input id="blur-radius" type="range" min="2" max="40" value="12" />
          <output id="blur-radius-value" for="blur-radius">12</output>
        </div>
        <div id="resize-group" class="option-group" role="group" aria-label="Resize">
          <span class="option-label">Resize</span>
          <input id="resize-width" class="num-input" type="number" min="1" step="1" />
          <span class="dim-sep">×</span>
          <input id="resize-height" class="num-input" type="number" min="1" step="1" />
          <label class="lock-label" title="Lock aspect ratio">
            <input id="resize-lock" type="checkbox" checked /> Lock
          </label>
          <button id="resize-apply" class="tool tool-text" type="button">Apply</button>
        </div>
        <div class="option-group grow"></div>
        <div class="option-group" role="group" aria-label="Export format">
          <div class="format-selector">
            <button id="format-png" class="format-option" type="button" aria-pressed="true">
              PNG
            </button>
            <button id="format-jpeg" class="format-option" type="button" aria-pressed="false">
              JPEG
            </button>
            <button id="format-pdf" class="format-option" type="button" aria-pressed="false">
              PDF
            </button>
          </div>
          <label id="quality-row" class="quality hidden" for="quality">
            <span>Quality</span>
            <input id="quality" type="range" min="1" max="100" value="90" />
            <output id="quality-value" for="quality">90</output>
          </label>
        </div>
        <div class="option-group" role="group" aria-label="Export actions">
          <button
            id="copy"
            class="tool"
            type="button"
            title="Copy to clipboard"
            aria-label="Copy to clipboard"
          >
            <svg
              class="ic"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="5.75" y="5.75" width="7.5" height="7.5" rx="1.5" />
              <path
                d="M10.25 5.75V4.1a1.35 1.35 0 0 0-1.35-1.35H4.1A1.35 1.35 0 0 0 2.75 4.1v4.8a1.35 1.35 0 0 0 1.35 1.35h1.65"
              />
            </svg>
          </button>
          <button id="download" class="tool primary" type="button">Download PNG</button>
        </div>
      </div>
    </header>

    <main id="stage" class="stage">
      <canvas id="canvas"></canvas>
    </main>

    <footer class="statusbar">
      <span id="status" role="status"></span>
      <span id="dims" class="dims"></span>
    </footer>

    <script type="module" src="./editor.ts"></script>
  </body>
</html>
