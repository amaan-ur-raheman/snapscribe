<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapScribe</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>SnapScribe</h1>
      <p class="tagline">On-device screenshot capture</p>
    </header>

    <section class="modes" aria-label="Capture modes">
      <button id="capture-visible" class="mode mode-primary" type="button">Visible area</button>
      <button id="capture-full-page" class="mode" type="button">Full page</button>
      <button id="capture-region" class="mode" type="button">Region</button>
      <button id="capture-element" class="mode" type="button">Element</button>
    </section>

    <div id="capture-card" class="capture-card hidden">
      <div class="actions">
        <div class="export-controls">
          <div class="format-selector" role="group" aria-label="Export format">
            <button id="format-png" class="format-option" type="button" aria-pressed="true">
              PNG
            </button>
            <button id="format-jpeg" class="format-option" type="button" aria-pressed="false">
              JPEG
            </button>
            <button id="format-pdf" class="format-option" type="button" aria-pressed="false">
              PDF
            </button>
          </div>
          <label id="quality-row" class="quality hidden" for="quality">
            <span>Quality</span>
            <input id="quality" type="range" min="1" max="100" value="90" />
            <output id="quality-value" for="quality">90</output>
          </label>
        </div>
        <button id="copy" class="action action-secondary" type="button" disabled>Copy image</button>
        <button id="download" class="action" type="button" disabled>Download PNG</button>
      </div>

      <section id="result" class="result">
        <img id="preview" alt="Capture preview" />
        <div class="meta">
          <span id="meta-dimensions"></span>
          <span id="meta-site"></span>
        </div>
      </section>
    </div>

    <p id="status" class="status" role="status"></p>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
