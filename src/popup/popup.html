<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapScribe</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg
            class="ic"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="1.5" y="3.75" width="13" height="9.75" rx="2.25" />
            <path d="M5.15 3.75 5.95 2.25h4.1l.8 1.5" />
            <circle cx="8" cy="8.55" r="2.55" />
          </svg>
        </span>
        <div class="brand-text">
          <h1>SnapScribe</h1>
          <p class="tagline">On-device capture</p>
        </div>
      </div>
      <button
        id="open-options"
        class="icon-btn"
        type="button"
        title="Settings"
        aria-label="Open settings"
      >
        <svg
          class="ic"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M2.75 4.5h10.5M2.75 8h10.5M2.75 11.5h10.5" />
          <path d="M6.25 2.9v3.2M10.25 6.4v3.2M5.75 9.9v3.2" />
        </svg>
      </button>
    </header>

    <section class="modes" aria-label="Capture modes">
      <button id="capture-visible" class="mode mode-primary" type="button">
        <svg
          class="ic"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="1.5" y="3.75" width="13" height="9.75" rx="2.25" />
          <path d="M5.15 3.75 5.95 2.25h4.1l.8 1.5" />
          <circle cx="8" cy="8.55" r="2.55" />
        </svg>
        <span>Visible area</span>
      </button>
      <button id="capture-full-page" class="mode" type="button">
        <svg
          class="ic"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M2.25 5.75V3.5A1.25 1.25 0 0 1 3.5 2.25h2.25" />
          <path d="M10.25 2.25h2.25A1.25 1.25 0 0 1 13.75 3.5v2.25" />
          <path d="M13.75 10.25v2.25a1.25 1.25 0 0 1-1.25 1.25h-2.25" />
          <path d="M5.75 13.75H3.5a1.25 1.25 0 0 1-1.25-1.25v-2.25" />
        </svg>
        <span>Full page</span>
      </button>
      <button id="capture-region" class="mode" type="button">
        <svg
          class="ic"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="2.25" y="2.25" width="11.5" height="11.5" rx="2.25" stroke-dasharray="3 2.4" />
          <path d="m9.9 9.9 2.6 2.6M12.5 9.9v2.6" />
        </svg>
        <span>Region</span>
      </button>
      <button id="capture-element" class="mode" type="button">
        <svg
          class="ic"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m3.6 2.6 10.2 5.8-4.5 1.1-1.1 4.5z" />
          <rect x="10.6" y="10.6" width="3.1" height="3.1" rx="0.9" />
        </svg>
        <span>Element</span>
      </button>
    </section>

    <div id="capture-card" class="capture-card hidden">
      <div class="actions">
        <div class="export-controls">
          <div class="format-selector" role="group" aria-label="Export format">
            <button id="format-png" class="format-option" type="button" aria-pressed="true">
              PNG
            </button>
            <button id="format-jpeg" class="format-option" type="button" aria-pressed="false">
              JPEG
            </button>
            <button id="format-pdf" class="format-option" type="button" aria-pressed="false">
              PDF
            </button>
          </div>
          <label id="quality-row" class="quality hidden" for="quality">
            <span>Quality</span>
            <input id="quality" type="range" min="1" max="100" value="90" />
            <output id="quality-value" for="quality">90</output>
          </label>
        </div>
        <button id="edit" class="action action-secondary" type="button" disabled>
          <svg
            class="ic"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4.05 11.95 11.8 4.2a1.35 1.35 0 0 1 1.9 1.9L5.95 13.85z" />
            <path d="m11.2 3.6 1.2 1.2" />
            <path d="M4.05 11.95 2.6 13.4" />
          </svg>
          <span>Open in editor</span>
        </button>
        <button id="copy" class="action action-secondary" type="button" disabled>
          <svg
            class="ic"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="5.75" y="5.75" width="7.5" height="7.5" rx="1.5" />
            <path
              d="M10.25 5.75V4.1a1.35 1.35 0 0 0-1.35-1.35H4.1A1.35 1.35 0 0 0 2.75 4.1v4.8a1.35 1.35 0 0 0 1.35 1.35h1.65"
            />
          </svg>
          <span>Copy image</span>
        </button>
        <button id="download" class="action" type="button" disabled>Download PNG</button>
      </div>

      <section id="result" class="result">
        <img id="preview" alt="Capture preview" />
        <div class="meta">
          <span id="meta-dimensions"></span>
          <span id="meta-site"></span>
        </div>
      </section>
    </div>

    <section id="history-section" class="history-section hidden" aria-label="Recent captures">
      <div class="history-header">
        <h2>Recent captures</h2>
        <button id="history-clear" class="history-clear" type="button">Clear</button>
      </div>
      <div id="history-grid" class="history-grid"></div>
      <p id="history-empty" class="history-empty hidden">
        No captures yet. Capture a page to see it here.
      </p>
    </section>

    <p id="status" class="status" role="status"></p>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
